services:
  - type: web
    name: ai-interview-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir --retries 10 --timeout 120 --prefer-binary -r requirements-backend.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
