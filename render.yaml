services:
  - type: web
    name: ai-interview-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: dots-studio/dots-3-note-preview:free
      - key: FASTAPI_URL
        value: https://ai-interview-backend.onrender.com

  - type: web
    name: ai-interview-frontend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FASTAPI_URL
        value: https://ai-interview-backend.onrender.com
